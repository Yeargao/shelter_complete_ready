name: Chat agent regression
on:
  push:
    branches: [main]
    paths:
      - 'backend/chat_agent.py'
      - 'backend/chat_intent.py'
      - 'backend/shelter_chat.py'
      - 'backend/agent_evaluation.py'
      - 'backend/test_chat_agent.py'
      - 'frontend/src/**'
      - '.github/workflows/chat-agent-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fastapi>=0.115,<1' 'pydantic>=2,<3'
      - run: python -m unittest test_chat_agent test_smart_tools -v
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
