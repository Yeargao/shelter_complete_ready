name: Chat agent regression
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/test_agent_live_api.py'
      - 'tests/test_chat_workflows.py'
      - 'tests/test_chat_workflow_followups.py'
      - 'frontend/src/**'
      - '.github/workflows/chat-agent-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fastapi>=0.115,<1' 'pydantic>=2,<3' 'httpx>=0.28,<1'
      - run: python -m unittest test_chat_agent test_smart_tools -v
        working-directory: backend
      - uses: actions/checkout@v4
        with:
          ref: 6a7140f7b5ea5d96ce5ce5c2ab4e06a804778673
          path: .baseline
      - name: Before change — same HTTP dialogue scenarios
        continue-on-error: true
        env:
          AGENT_BACKEND_DIR: ${{ github.workspace }}/.baseline/backend
        run: python tests/test_agent_live_api.py
      - name: After change — real HTTP dialogue and incremental audit
        run: python tests/test_agent_live_api.py
      - uses: actions/checkout@v4
        with:
          ref: 519852f10c1b75e47ec7063e029a03c5908e7b18
          path: .workflow-baseline
      - name: Before role-specific improvements — user journeys
        continue-on-error: true
        env:
          AGENT_BACKEND_DIR: ${{ github.workspace }}/.workflow-baseline/backend
        run: python tests/test_chat_workflows.py
      - name: After role-specific improvements — user journeys
        run: python tests/test_chat_workflows.py
      - uses: actions/checkout@v4
        with:
          ref: 5c09d083f27556cee14e28a944c449427dca4da2
          path: .followup-baseline
      - name: Before second iteration — follow-up user journeys
        continue-on-error: true
        env:
          AGENT_BACKEND_DIR: ${{ github.workspace }}/.followup-baseline/backend
        run: python tests/test_chat_workflow_followups.py
      - name: After second iteration — follow-up user journeys
        run: python tests/test_chat_workflow_followups.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
