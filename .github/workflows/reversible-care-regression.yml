name: Reversible care workflow regression
on:
  push:
    branches: [improve/reversible-care-workflows]
  pull_request:
    branches: [main]
    paths:
      - 'backend/weekly_schedule.py'
      - 'backend/report_reversal.py'
      - 'backend/chat_agent.py'
      - 'backend/chat_workflows.py'
      - 'frontend/src/**'
      - 'tests/test_weekly_schedule.py'
      - 'tests/test_chat_workflows.py'
      - '.github/workflows/reversible-care-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fastapi>=0.115,<1' 'pydantic>=2,<3' 'httpx>=0.28,<1' 'ortools>=9.10,<10' 'Pillow>=10,<14' tzdata
      - run: python -m compileall -q backend tests
      - run: python -m unittest discover -s tests -p test_weekly_schedule.py -v
      - run: python tests/test_care_workflow_dialogue.py
      - run: python tests/test_chat_workflows.py
      - run: python tests/test_chat_workflow_followups.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
